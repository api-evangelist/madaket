openapi: 3.2.0
info:
  title: Madaket Health Provider Work Entry API
  version: '2.0'
  description: RESTful JSON endpoints published by Madaket Health for clean, high-quality US healthcare provider data — provider demographics, licensure, credentialing, education, sanctions and payer records.
  contact:
    name: Madaket Health
    url: https://www.madakethealth.com/
servers:
- url: https://provider.madakethealth.com/provider-services
  description: 'Production (probed 2026-08-25: HTTP 503)'
security:
- api_key: []
  auth_token: []
tags:
- name: WorkEntry
paths:
  /api/v2.0/work-entry/filter:
    post:
      tags:
      - WorkEntry
      summary: list all WorkEntry resources using the given filter criteria
      operationId: workEntryFilter
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkEntry'
        '401':
          description: Authentication failed - missing or invalid api_key / auth_token
        '404':
          description: Resource not found
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkEntryAuthorizedFilterQuery'
  /api/v2.0/provider/{providerGuid}/work-entry:
    get:
      tags:
      - WorkEntry
      summary: list all WorkEntry resources that belong to the given Provider
      operationId: workEntryList
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkEntry'
        '401':
          description: Authentication failed - missing or invalid api_key / auth_token
        '404':
          description: Resource not found
      parameters:
      - name: providerGuid
        in: path
        required: true
        schema:
          type: string
  /api/v2.0/work-entry/{id}:
    get:
      tags:
      - WorkEntry
      summary: get a specific WorkEntry using its unique ID
      operationId: workEntryLoad
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkEntry'
        '401':
          description: Authentication failed - missing or invalid api_key / auth_token
        '404':
          description: Resource not found
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/v2.0/work-entry/search:
    post:
      tags:
      - WorkEntry
      summary: search through all WorkEntry resources using the given search criteria
      operationId: workEntrySearch
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkEntry'
        '401':
          description: Authentication failed - missing or invalid api_key / auth_token
        '404':
          description: Resource not found
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkEntryAuthorizedSearchQuery'
