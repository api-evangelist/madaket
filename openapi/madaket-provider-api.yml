openapi: 3.0.3
info:
  title: Madaket Health Provider API
  version: '2.0'
  description: 'RESTful JSON endpoints published by Madaket Health for clean, high-quality US healthcare
    provider data — provider demographics, licensure, credentialing, education, sanctions and payer records.


    PROVENANCE: this description was RECONSTRUCTED by API Evangelist from Madaket''s own first-party npm
    client @madaket/provider-api-client-js@0.0.3 (swagger-codegen 2.2.3 output), because Madaket''s published
    Swagger URL https://provider.madakethealth.com/provider-services/api-spec/api-spec.json returned HTTP
    503 when probed on 2026-08-25. Paths, verbs, summaries, parameters, request/response models and security
    schemes are taken verbatim from that generated client. operationIds were normalized to <tag><Operation>
    because swagger-codegen namespaces them per API class and they are not globally unique in the generated
    output. This is NOT a document Madaket serves.'
  contact:
    name: Madaket Health
    url: https://www.madakethealth.com/
servers:
- url: https://provider.madakethealth.com/provider-services
  description: 'Production (probed 2026-08-25: HTTP 503)'
