aid: madaket
name: Madaket
description: 'Madaket Health is a Cambridge, Massachusetts healthcare administration company
  whose Provider Data Management (PDM) platform automates payer enrollment, EDI enrollment,
  credentialing, licensing and provider directory data management between healthcare providers
  and payers. Madaket maintains connections to thousands of US payers and publishes a REST
  Provider API for clean, high-quality provider data — demographics, licensure, education,
  sanctions, malpractice and payer records — alongside ProviderJSON, an open JSON format for
  representing US healthcare providers derived from NPI/NPPES enumeration data.'
url: https://raw.githubusercontent.com/api-evangelist/madaket/refs/heads/main/apis.yml
