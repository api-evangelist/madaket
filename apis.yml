apis:
- aid: madaket:provider-api
  name: Madaket Provider API
  description: 'RESTful JSON endpoints published by Madaket Health for clean, high-quality US
    healthcare provider data. 211 operations across 57 resource families covering provider
    demographics, professional and DEA/CDS licensure, education and training, board
    certifications, hospital privileges, malpractice and liability actions, OIG exclusions,
    Medicare/Medicaid records, specialties and taxonomies. Authenticated with an issued API key
    plus a time-windowed SHA-256 auth token.'
