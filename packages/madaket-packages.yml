  api_version_wrapped: v2.0
  summary: >-
    Every first-party Madaket SDK is at least seven years old, and two of the three never moved
    past 0.0.3. The company continues to market the platform actively (2026 blog posts, current
    AWS Marketplace listing), so the SDKs have decayed away from a product that is still selling.
    Combined with the HTTP 503 on both the documented API host (api.madakethealth.com) and the
    published Swagger URL, the public developer surface appears unmaintained even though the
    business is not.
